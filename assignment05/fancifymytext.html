<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>

		<!-- link to your script file here -->
		<script src="fancifymytext.js"></script>
	</head>

	<body>
		<h1>Fancify my Text</h1>

		<!-- Your UI controls go here -->
		<fieldset>
			<legend>Text</legend>
			<textarea id="userText" rows="4" cols="30">Type something here. Then try the buttons.</textarea>
		</fieldset>

		<fieldset>
			<legend>Fancify</legend>

			<button onclick="bigger()">Bigger!</button>
			<button onclick="moo()">Moo</button>

			<br><br>

			<input type="radio" id="fancy" name="style" onchange="fancify()">
			<label for="fancy">FancyShmancy</label>

			<input type="radio" id="boring" name="style" onchange="fancify()">
			<label for="boring">BoringBetty</label>
		</fieldset>
	</body>
</html>
